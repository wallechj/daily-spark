name: Daily Spark 自动更新

on:
  schedule:
    - cron: '30 2 * * *'  # 每天 10:30（北京时间）检查一次
  workflow_dispatch:      # 也允许在网页上手动触发

permissions:
  contents: write

jobs:
  spark:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 执行更新检查
        run: python3 scripts/daily-update.py

      - name: 提交改动（如有）
        run: |
          if [ -f /tmp/spark-commit-msg.txt ]; then
            git config user.name "wallechj"
            git config user.email "46899331+wallechj@users.noreply.github.com"
            git add -A
            git commit -m "$(cat /tmp/spark-commit-msg.txt)"
            git push
            echo "已提交：$(cat /tmp/spark-commit-msg.txt)"
          else
            echo "未到更新间隔，本次无提交"
          fi
